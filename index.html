
<!DOCTYPE html>
<html>
<head>
    <title>Student Marks</title>
</head>
<body>

    <h2>Student Marks Calculation</h2>

    <script>
        let m1 = 80;
        let m2 = 90;
        let m3 = 70;

        let total = m1 + m2 + m3;
        let average = total / 3;

        document.write("Total Marks: " + total + "<br>");
        document.write("Average Marks: " + average);
    </script>

</body>
</html>
